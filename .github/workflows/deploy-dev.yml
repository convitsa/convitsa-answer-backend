name: Deploy Backend - Development

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  ACR_NAME: "convitsaacrdev"
  RESOURCE_GROUP: "Convitsa-Development"
  APP_NAME: "convitsa-answer-backend-dev"
  IMAGE_NAME: "convitsa-answer-backend"
  ENVIRONMENT: "development"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: development
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: ACR Login
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Define image tag
        id: names
        run: |
          echo "image_tag=${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Build Docker Image
        run: |
          docker build \
            --build-arg NODE_ENV="${{ vars.NODE_ENV || 'production' }}" \
            --build-arg PORT="${{ vars.PORT || '3000' }}" \
            --build-arg MONGODB_URI="${{ secrets.MONGODB_URI }}" \
            --build-arg REDIS_URL="${{ secrets.REDIS_URL }}" \
            --build-arg AZURE_OPENAI_ENDPOINT="${{ secrets.AZURE_OPENAI_ENDPOINT }}" \
            --build-arg AZURE_OPENAI_API_KEY="${{ secrets.AZURE_OPENAI_API_KEY }}" \
            --build-arg AZURE_OPENAI_API_VERSION="${{ vars.AZURE_OPENAI_API_VERSION || '2024-08-01-preview' }}" \
            --build-arg AZURE_OPENAI_CHAT_DEPLOYMENT="${{ secrets.AZURE_OPENAI_CHAT_DEPLOYMENT }}" \
            --build-arg AZURE_OPENAI_EMBEDDING_DEPLOYMENT="${{ secrets.AZURE_OPENAI_EMBEDDING_DEPLOYMENT }}" \
            --build-arg AZURE_BLOB_CONNECTION_STRING="${{ secrets.AZURE_BLOB_CONNECTION_STRING }}" \
            --build-arg AZURE_BLOB_CONTAINER_NAME="${{ vars.AZURE_BLOB_CONTAINER_NAME || 'convitsa-documents' }}" \
            --build-arg AZURE_VISION_ENDPOINT="${{ secrets.AZURE_VISION_ENDPOINT }}" \
            --build-arg AZURE_VISION_KEY="${{ secrets.AZURE_VISION_KEY }}" \
            --build-arg FIRECRAWL_API_KEY="${{ secrets.FIRECRAWL_API_KEY }}" \
            --build-arg CRAWL_MAX_PAGES="${{ vars.CRAWL_MAX_PAGES || '50' }}" \
            --build-arg CRAWL_TIMEOUT_SECONDS="${{ vars.CRAWL_TIMEOUT_SECONDS || '300' }}" \
            --build-arg RESEND_API_KEY="${{ secrets.RESEND_API_KEY }}" \
            --build-arg RESEND_FROM_EMAIL="${{ secrets.RESEND_FROM_EMAIL }}" \
            --build-arg JWT_SECRET="${{ secrets.JWT_SECRET }}" \
            --build-arg JWT_REFRESH_SECRET="${{ secrets.JWT_REFRESH_SECRET }}" \
            --build-arg JWT_EXPIRES_IN="${{ vars.JWT_EXPIRES_IN || '1h' }}" \
            --build-arg JWT_REFRESH_EXPIRES_IN="${{ vars.JWT_REFRESH_EXPIRES_IN || '7d' }}" \
            --build-arg MAX_FILE_SIZE_MB="${{ vars.MAX_FILE_SIZE_MB || '50' }}" \
            --build-arg MAX_FILES_PER_PROJECT="${{ vars.MAX_FILES_PER_PROJECT || '100' }}" \
            --build-arg MAX_STORAGE_PER_PROJECT_MB="${{ vars.MAX_STORAGE_PER_PROJECT_MB || '500' }}" \
            --build-arg GUMROAD_SELLER_ID="${{ secrets.GUMROAD_SELLER_ID }}" \
            --build-arg GUMROAD_WEBHOOK_TOKEN="${{ secrets.GUMROAD_WEBHOOK_TOKEN }}" \
            --build-arg MAX_WS_CONNECTIONS_PER_KEY="${{ vars.MAX_WS_CONNECTIONS_PER_KEY || '100' }}" \
            -t ${{ steps.names.outputs.image_tag }} \
            -f Dockerfile .

      - name: Push Docker Image
        run: |
          docker push ${{ steps.names.outputs.image_tag }}
          LATEST_TAG="${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:latest"
          docker tag ${{ steps.names.outputs.image_tag }} "$LATEST_TAG"
          docker push "$LATEST_TAG"

      - name: Deploy to Azure Web App (container)
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ env.APP_NAME }}
          images: "${{ steps.names.outputs.image_tag }}"

      - name: Deployment Summary
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **App Name:** ${{ env.APP_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Image:** ${{ steps.names.outputs.image_tag }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment:** ${{ env.ENVIRONMENT }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
