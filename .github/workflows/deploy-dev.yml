name: Deploy Backend - Development

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  ENVIRONMENT: "development"
  DEPLOY_PATH: "/opt/convitsa/backend-dev"

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: development

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Write .env
        run: |
          cat > .env <<EOF
          PORT=3000
          NODE_ENV=production
          CONTAINER_NAME=convitsa-backend-dev
          UPLOADS_PATH=${{ vars.UPLOADS_PATH }}

          MONGODB_URI=${{ secrets.MONGODB_URI }}
          REDIS_URL=${{ vars.REDIS_URL }}

          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          GEMINI_CHAT_MODEL=${{ vars.GEMINI_CHAT_MODEL || 'gemini-2.5-flash' }}
          GEMINI_EMBEDDING_MODEL=${{ vars.GEMINI_EMBEDDING_MODEL || 'gemini-embedding-001' }}

          STORAGE_PATH=/app/uploads
          PUBLIC_BASE_URL=${{ vars.PUBLIC_BASE_URL }}

          JWT_SECRET=${{ secrets.JWT_SECRET }}
          JWT_REFRESH_SECRET=${{ secrets.JWT_REFRESH_SECRET }}
          JWT_EXPIRES_IN=1h
          JWT_REFRESH_EXPIRES_IN=7d

          RATE_LIMIT_FREE_MESSAGES_PER_MIN=5
          RATE_LIMIT_PRO_MESSAGES_PER_MIN=30
          MAX_WS_CONNECTIONS_PER_KEY=100

          FIRECRAWL_API_KEY=${{ secrets.FIRECRAWL_API_KEY }}
          CRAWL_MAX_PAGES=20
          CRAWL_TIMEOUT_SECONDS=120

          RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL=${{ vars.RESEND_FROM_EMAIL }}

          STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET=${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_SUCCESS_URL=${{ vars.STRIPE_SUCCESS_URL }}
          STRIPE_CANCEL_URL=${{ vars.STRIPE_CANCEL_URL }}
          STRIPE_PRO_PRICE_ID=${{ vars.STRIPE_PRO_PRICE_ID }}
          STRIPE_BUSINESS_PRICE_ID=${{ vars.STRIPE_BUSINESS_PRICE_ID }}
          STRIPE_PRO_YEARLY_PRICE_ID=${{ vars.STRIPE_PRO_YEARLY_PRICE_ID }}
          STRIPE_BUSINESS_YEARLY_PRICE_ID=${{ vars.STRIPE_BUSINESS_YEARLY_PRICE_ID }}

          FREE_TOKENS_PER_MONTH=${{ vars.FREE_TOKENS_PER_MONTH || '5000' }}
          PRO_TOKENS_PER_MONTH=${{ vars.PRO_TOKENS_PER_MONTH || '100000' }}
          BUSINESS_TOKENS_PER_MONTH=${{ vars.BUSINESS_TOKENS_PER_MONTH || '250000' }}
          FREE_PROJECTS_LIMIT=${{ vars.FREE_PROJECTS_LIMIT || '1' }}
          PRO_PROJECTS_LIMIT=${{ vars.PRO_PROJECTS_LIMIT || '5' }}
          BUSINESS_PROJECTS_LIMIT=${{ vars.BUSINESS_PROJECTS_LIMIT || '999' }}
          EOF

      - name: Load deploy SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VM_SSH_KEY }}

      - name: Sync code + .env to the VM
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.VM_SSH_HOST }}" >> ~/.ssh/known_hosts
          rsync -az --delete \
            --exclude '.git' --exclude 'node_modules' \
            ./ "${{ secrets.VM_SSH_USER }}@${{ secrets.VM_SSH_HOST }}:${{ env.DEPLOY_PATH }}/"

      - name: Build and start on the VM
        run: |
          ssh "${{ secrets.VM_SSH_USER }}@${{ secrets.VM_SSH_HOST }}" \
            "cd ${{ env.DEPLOY_PATH }} && docker compose up -d --build && docker image prune -f"

      - name: Deployment Summary
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment:** ${{ env.ENVIRONMENT }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
