name: Deploy Backend - Development

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  ENVIRONMENT: "development"
  DEPLOY_PATH: "/opt/convitsa/backend-dev"
  COMPOSE_PROJECT_NAME: "convitsa-backend-dev"

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: development

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VM_SSH_HOST }}
          username: ${{ secrets.VM_SSH_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            set -e
            cd ${{ env.DEPLOY_PATH }}
            git fetch origin main
            git checkout ${{ github.sha }}
            COMPOSE_PROJECT_NAME=${{ env.COMPOSE_PROJECT_NAME }} docker compose up -d --build
            docker image prune -f

      - name: Deployment Summary
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment:** ${{ env.ENVIRONMENT }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
